<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>容器终端</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@4.19.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@4.19.0/lib/xterm.js"></script> -->
    <link href="/static/layui/css/layui.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/xterm/xterm.css" />
    <script src="/static/xterm/xterm.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1890ff;
            margin-bottom: 10px;
        }
        
        .form-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .form-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #333;
        }
        
        .form-item {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: inline-block;
            width: 80px;
            font-weight: 500;
            margin-right: 10px;
        }
        
        .form-control {
            width: 200px;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .btn {
            display: inline-block;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background-color: #1890ff;
            color: #fff;
        }
        
        .btn-primary:hover {
            background-color: #40a9ff;
        }
        
        .terminal-container {
            flex: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .terminal-header {
            background-color: #f0f0f0;
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .terminal-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        
        .terminal-actions {
            display: flex;
            gap: 10px;
        }
        
        .terminal-window {
            flex: 1;
            overflow: hidden;
        }
        
        #terminal {
            width: 100%;
            height: 100%;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .form-control {
                width: 100%;
            }
            
            .form-label {
                display: block;
                margin-bottom: 5px;
            }
        }
      </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>容器终端</h1>
        </div>
        
        <div class="form-card">
            <div class="form-title">终端配置</div>
            <form id="terminal-form">
                <div class="form-item">
                    <label class="form-label">Command:</label>
                    <select name="command" class="form-control">
                        <option value="/bin/sh" selected>/bin/sh</option>
                        <option value="/bin/bash">/bin/bash</option>
                        <option value="/bin/ash">/bin/ash</option>
                    </select>
                </div>
                <div class="form-item">
                    <label class="form-label">User:</label>
                    <input type="text" name="user" value="root" class="form-control" placeholder="请输入用户名">
                </div>
                <div class="form-item">
                    <button type="button" id="connect-btn" class="btn btn-primary">连接</button>
                </div>
            </form>
        </div>
        
        <div class="terminal-container">
            <div class="terminal-header">
                <div class="terminal-title">终端窗口</div>
                <div class="terminal-actions">
                    <button type="button" id="clear-btn" class="btn">清空</button>
                </div>
            </div>
            <div class="terminal-window">
                <div id="terminal"></div>
            </div>
        </div>
    </div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var ws;
        var term = new Terminal({
            cursorBlink: true, // 光标闪烁
            lineHeight: 1.2,  //行高
            fontSize: 14,  //字体大小
            cursorStyle: 'underline', // 光标样式
            scrollback: 1000,
            tabStopWidth: 4,
            fontFamily: "Monaco, Menlo, Consolas, 'Courier New', monospace", //字体
            convertEol: true, //启用时，光标将设置为下一行的开头
            disableStdin: false, //是否禁用输入
            theme: {  //主题
                background: '#181d28',  //背景
                foreground: '#FFF',  //前景
                cursor: '#FFFFFF' //设置光标颜色
            }
        });
        
        // 显示终端区域的函数
        function showTerminal() {
            document.getElementById('terminal').style.display = 'block';
        }
        
        // 隐藏终端区域的函数
        function hideTerminal() {
            document.getElementById('terminal').style.display = 'none';
        }
        
        // 更新终端显示状态和按钮文本的函数
        function updateTerminalDisplay(isConnected) {
            var connectBtn = document.getElementById('connect-btn');
            connectBtn.textContent = isConnected ? '断开连接' : '连接';
            if (isConnected) {
                showTerminal();
            } else {
                hideTerminal();
                ws = null; // 关闭连接时清理WebSocket对象
            }
        }
        
        // 清空终端内容的函数
        function clearTerminal() {
            term.clear();
        }
        
        // 调整终端大小的函数
        function resizeTerminal() {
            var terminalElement = document.getElementById('terminal');
            var containerElement = terminalElement.parentElement;
            var width = containerElement.clientWidth;
            var height = containerElement.clientHeight;
            
            term.resize(Math.floor(width / 8), Math.floor(height / 18));
        }
        
        // 初始化WebSocket连接
        function initializeWebSocket() {
            term.open(document.getElementById('terminal'));
            
            // 调整终端大小
            resizeTerminal();
            // 监听窗口大小变化
            window.addEventListener('resize', resizeTerminal);
            
            // 获取表单选项
            var command = document.querySelector('[name="command"]').value;
            var user = document.querySelector('[name="user"]').value;
            
            // 获取容器ID
            var container_id = '{{ connect.container_id }}';
            
            // 创建WebSocket连接
            var wsUrl = 'ws://' + window.location.host + '/apps/docker_terminal/?container=' + container_id + '&workdir=/&cmd=' + command;
            console.log("请求地址：" + wsUrl);
            ws = new WebSocket(wsUrl);
        
            ws.onopen = function () {
                console.log('WebSocket connection established');
                document.getElementById('connect-btn').textContent = '断开连接';
                updateTerminalDisplay(true);
                term.focus(); // 自动聚焦到终端上
            };
        
            ws.onmessage = function (event) {
                // 实时处理从服务器接收的数据
                term.write(event.data);
            };
        
            ws.onclose = function (event) {
                // 连接关闭时的处理逻辑
                console.log('WebSocket连接已关闭', event);
                term.write('\n\r\x1B[1;3;31m断开连接！\x1B[0m');
                updateTerminalDisplay(false); // 更新终端显示为未连接状态
            };
        
            ws.onerror = function (error) {
                console.log('WebSocket error: ', error);
                term.write('\n\r\x1B[1;3;31m连接错误！\x1B[0m');
                clearTerminal();
            };
        
            // 直接处理终端输入，实时发送到服务器
            term.onData(function (data) {
                // 直接发送输入到服务器，不使用缓冲区
                if(ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                }
            });
        }
        
        // 按钮事件监听
        document.getElementById('connect-btn').addEventListener('click', function() {
            var currentText = this.textContent;
            if (currentText === '连接') {
                // 在尝试建立新连接之前，检查并关闭任何现有的连接
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.close(); // 关闭现有的WebSocket连接
                }
                ws = null; // 清除WebSocket对象
            
                // 尝试连接
                initializeWebSocket();
            } else if (currentText === '断开连接' && ws) {
                ws.close(); // 如果按钮显示“断开连接”，则关闭WebSocket连接
                ws = null; // 清除WebSocket对象
                updateTerminalDisplay(false);
            }
        });
        
        // 清空终端按钮事件监听
        document.getElementById('clear-btn').addEventListener('click', function() {
            clearTerminal();
        });
        
        // 确保连接关闭时也更新按钮文本
        window.onbeforeunload = function() {
            if(ws) {
                ws.close();
            }
        };
    });
    </script>
</html>
